apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: festipass
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: festipass
          envFrom:
            - secretRef:
                name: festipass-db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "festipass", "-d", "festipass"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: festipass
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
