apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: festipass
  labels:
    app: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
        - name: back
          image: ghcr.io/mikou-mouad/festipass-back:1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: festipass
            - name: DB_USER
              value: festipass
            - name: DB_PASSWORD
              value: embruns-2026
            - name: FESTIVAL
              value: Festival des Embruns
            - name: CLE_SIGNATURE
              value: cle-de-dev
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: festipass
  labels:
    app: back
spec:
  selector:
    app: back
  ports:
    - name: http
      port: 8080
      targetPort: http
