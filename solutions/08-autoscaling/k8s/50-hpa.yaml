apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: back
  namespace: festipass
  labels:
    app: back
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: back
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60     # 60 % des requests CPU (250m), soit 150m par pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # 5 min par défaut : raccourci pour le TP
