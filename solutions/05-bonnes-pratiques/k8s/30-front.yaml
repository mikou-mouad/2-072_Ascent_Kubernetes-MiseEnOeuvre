apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: festipass
  labels:
    app: front
    app.kubernetes.io/name: festipass
    app.kubernetes.io/component: front
    app.kubernetes.io/part-of: festival-des-embruns
    app.kubernetes.io/version: "1.1"
    environnement: production
  annotations:
    kubernetes.io/change-cause: "front 1.1 : nouvelle charte corail"
    festipass.fr/equipe: developpement
    festipass.fr/contact: yanis@festipass.example
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        app.kubernetes.io/name: festipass
        app.kubernetes.io/component: front
        app.kubernetes.io/part-of: festival-des-embruns
        app.kubernetes.io/version: "1.1"
        environnement: production
    spec:
      containers:
        - name: front
          image: ghcr.io/mikou-mouad/festipass-front:1.1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: annonce
              mountPath: /usr/share/nginx/html/config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: annonce
          configMap:
            name: front-annonce
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: festipass
  labels:
    app: front
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
