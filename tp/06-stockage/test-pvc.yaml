# Un volume de test et un pod qui écrit dedans.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: festipass
  labels:
    etape: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  # pas de storageClassName : la StorageClass par défaut
---
apiVersion: v1
kind: Pod
metadata:
  name: ecrivain
  namespace: festipass
  labels:
    etape: "2"
spec:
  containers:
    - name: ecrivain
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "date >> /data/passages.txt; cat /data/passages.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
