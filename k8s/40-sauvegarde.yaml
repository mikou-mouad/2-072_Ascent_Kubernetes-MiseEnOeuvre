apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sauvegardes
  namespace: festipass
  labels:
    app: sauvegarde
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sauvegarde
  namespace: festipass
  labels:
    app: sauvegarde
    app.kubernetes.io/name: festipass
    app.kubernetes.io/component: sauvegarde
    app.kubernetes.io/part-of: festival-des-embruns
    environnement: production
  annotations:
    festipass.fr/equipe: exploitation
    festipass.fr/contact: camille@festipass.example
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: sauvegarde
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: public.ecr.aws/docker/library/postgres:16
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: festipass-db
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: festipass-db
                      key: POSTGRES_PASSWORD
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  FICHIER=/sauvegardes/festipass-$(date +%Y%m%d-%H%M%S).sql.gz
                  pg_dump festipass | gzip > "$FICHIER"
                  echo "Sauvegarde : $FICHIER"
                  ls -lh /sauvegardes
                  # on garde les 7 dernières
                  ls -1t /sauvegardes/*.sql.gz | tail -n +8 | xargs -r rm -f
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - name: sauvegardes
                  mountPath: /sauvegardes
          volumes:
            - name: sauvegardes
              persistentVolumeClaim:
                claimName: sauvegardes
