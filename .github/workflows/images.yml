# Construit et publie les images FestiPass sur GitHub Container Registry.
# Après la première exécution, rendre les paquets publics (GitHub > Packages > Settings).
name: images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Un build en échec ne doit pas annuler les autres
      fail-fast: false
      matrix:
        include:
          - { image: festipass-back,  context: app/back,  tag: "1.0", couleur: "" }
          - { image: festipass-front, context: app/front, tag: "1.0", couleur: "#1d3557" }
          - { image: festipass-front, context: app/front, tag: "1.1", couleur: "#e76f51" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            APP_VERSION=${{ matrix.tag }}
            ${{ matrix.couleur && format('COULEUR={0}', matrix.couleur) || '' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
